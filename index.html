<!doctype html>
<html lang="es">
      <head>
            <meta charset="UTF-8" />
            <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0"
            />
            <meta name="robots" content="index,follow" />
            <link rel="canonical" href="https://viajesvirgo.com/" />

            <title>Viajes Virgo | Agencia de viajes en Monterrey, N.L.</title>
            <meta
                  name="description"
                  content="Somos una agencia de viajes establecida en la ciudad de Monterrey, N.L., México, con más de 30 años de experiencia tanto en viajes nacionales como internacionales."
            />

            <!-- Para compartir en WhatsApp / Facebook -->
            <meta property="og:type" content="website" />
            <meta
                  property="og:title"
                  content="Viajes Virgo | Agencia de viajes en Monterrey"
            />
            <meta
                  property="og:description"
                  content="Más de 30 años de experiencia en viajes nacionales e internacionales."
            />
            <meta property="og:url" content="https://viajesvirgo.com/" />
            <meta
                  property="og:image"
                  content="https://viajesvirgo.com/imagenes/celular/inicio/playas.jpg"
            />

            <link rel="icon" href="./imagenes/favicon.ico" />

            <!-- Marca que hay JavaScript (para el menú de hamburguesa) -->
            <script>
                  document.documentElement.classList.add('js');
            </script>

            <link rel="stylesheet" href="./css/celular.css" />
            <link rel="stylesheet" href="./css/tablet.css" />
            <link rel="stylesheet" href="./css/laptop.css" />

            <link rel="preconnect" href="https://fonts.googleapis.com" />
            <link
                  rel="preconnect"
                  href="https://fonts.gstatic.com"
                  crossorigin
            />
            <link
                  href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
                  rel="stylesheet"
            />

            <script src="./js/menu.js" defer></script>

            <!-- GA4 -->
            <script
                  async
                  src="https://www.googletagmanager.com/gtag/js?id=G-BDE8DL6CD9"
            ></script>
            <script>
                  window.dataLayer = window.dataLayer || [];
                  function gtag() {
                        dataLayer.push(arguments);
                  }
                  gtag('js', new Date());

                  gtag('config', 'G-BDE8DL6CD9');
            </script>
      </head>

      <!--
    PAGINA WEB DISEÑADA POR: https://github.com/iecgerman
  -->

      <body>
            <header>
                  <nav class="main-nav" aria-label="Principal">
                        <div class="main-nav__bar">
                              <a
                                    href="./index.html"
                                    class="main-menu__link--logo"
                              >
                                    <img
                                          class="logo-menu"
                                          src="./imagenes/celular/logo_viajes_virgo.svg"
                                          alt="Viajes Virgo, ir al inicio"
                                    />
                              </a>

                              <button
                                    class="menu-toggle"
                                    type="button"
                                    aria-expanded="false"
                                    aria-controls="menu-principal"
                                    aria-label="Abrir menú"
                              >
                                    <span class="menu-toggle__linea"></span>
                                    <span class="menu-toggle__linea"></span>
                                    <span class="menu-toggle__linea"></span>
                              </button>
                        </div>

                        <ul class="main-menu" id="menu-principal">
                              <li class="main-menu__item">
                                    <a
                                          href="./index.html"
                                          class="main-menu__link"
                                          aria-current="page"
                                          >Inicio</a
                                    >
                              </li>
                              <li class="main-menu__item">
                                    <a href="./playas/" class="main-menu__link"
                                          >Playas</a
                                    >
                              </li>
                              <li class="main-menu__item">
                                    <a
                                          href="./ciudades/"
                                          class="main-menu__link"
                                          >Ciudades</a
                                    >
                              </li>
                              <li class="main-menu__item">
                                    <a
                                          href="./cruceros/"
                                          class="main-menu__link"
                                          >Cruceros</a
                                    >
                              </li>
                              <li class="main-menu__item">
                                    <a href="./parques/" class="main-menu__link"
                                          >Parques</a
                                    >
                              </li>
                              <li class="main-menu__item">
                                    <a
                                          href="./contacto/"
                                          class="main-menu__link"
                                          >Contacto</a
                                    >
                              </li>
                        </ul>
                  </nav>
            </header>

            <main>
                  <h1 class="visually-hidden">
                        Viajes Virgo, agencia de viajes en Monterrey
                  </h1>

                  <section class="contenedor__cards">
                        <div class="card">
                              <a
                                    href="./playas/"
                                    class="card__thumbnail"
                                    aria-hidden="true"
                                    tabindex="-1"
                              >
                                    <img
                                          class="card__img"
                                          src="./imagenes/celular/inicio/playas.jpg"
                                          alt=""
                                          decoding="async"
                                    />
                              </a>
                              <h2 class="card__titulo">
                                    <a href="./playas/" class="card__enlace"
                                          >Playas</a
                                    >
                              </h2>
                        </div>

                        <div class="card">
                              <a
                                    href="./ciudades/"
                                    class="card__thumbnail"
                                    aria-hidden="true"
                                    tabindex="-1"
                              >
                                    <img
                                          class="card__img"
                                          src="./imagenes/celular/ciudades/las_vegas.jpg"
                                          alt=""
                                          loading="lazy"
                                          decoding="async"
                                    />
                              </a>
                              <h2 class="card__titulo">
                                    <a href="./ciudades/" class="card__enlace"
                                          >Ciudades</a
                                    >
                              </h2>
                        </div>

                        <div class="card">
                              <a
                                    href="./cruceros/"
                                    class="card__thumbnail"
                                    aria-hidden="true"
                                    tabindex="-1"
                              >
                                    <img
                                          class="card__img"
                                          src="./imagenes/celular/cruceros/wonder_of_the_seas.jpg"
                                          alt=""
                                          loading="lazy"
                                          decoding="async"
                                    />
                              </a>
                              <h2 class="card__titulo">
                                    <a href="./cruceros/" class="card__enlace"
                                          >Cruceros</a
                                    >
                              </h2>
                        </div>

                        <div class="card">
                              <a
                                    href="./parques/"
                                    class="card__thumbnail"
                                    aria-hidden="true"
                                    tabindex="-1"
                              >
                                    <img
                                          class="card__img"
                                          src="./imagenes/celular/parques/disney.jpg"
                                          alt=""
                                          loading="lazy"
                                          decoding="async"
                                    />
                              </a>
                              <h2 class="card__titulo">
                                    <a href="./parques/" class="card__enlace"
                                          >Parques</a
                                    >
                              </h2>
                        </div>
                  </section>
            </main>

            <footer>
                  <p>
                        <a href="https://pcymac.com/servicios/"
                              >Diseño Web por pcymac.com</a
                        >
                  </p>
            </footer>
      </body>
</html>
